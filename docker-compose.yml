# Local PostgreSQL for development. Credentials match .env.example.
name: patient-dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
      POSTGRES_DB: patient_dashboard
    ports:
      - "5432:5432"
    volumes:
      - patient_dashboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patient_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patient_dashboard_pg:
